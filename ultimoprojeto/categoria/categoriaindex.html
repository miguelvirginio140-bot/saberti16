<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cadastro de Categoria de Produto</title>

  <link
    rel="stylesheet"
    href="categoria.css"
  >

</head>


<body>

  <main class="container">


    <!-- =====================================================
         TÍTULO
    ====================================================== -->

    <h1>
      Cadastro de Categoria de Produto
    </h1>


    <!-- =====================================================
         FORMULÁRIO
    ====================================================== -->

    <form
      id="formCliente"
      class="form-cliente"
    >


      <!-- ==================== CÓDIGO ==================== -->

      <div class="campo">

        <label for="categoriaprodutoid">
          Código
        </label>

        <input
          type="number"
          id="categoriaprodutoid"
          placeholder="Gerado automaticamente"
          readonly
        >

      </div>


      <!-- ==================== DESCRIÇÃO ==================== -->

      <div class="campo campo-largo">

        <label for="ds_categoria_produto">
          Descrição da Categoria
        </label>

        <input
          type="text"
          id="ds_categoria_produto"
          maxlength="100"
          placeholder="Digite a descrição"
          required
        >

      </div>


      <!-- ===================================================
           BOTÕES
      ==================================================== -->

      <div class="acoes">

        <button
          type="reset"
          class="btn-limpar"
        >
          Limpar
        </button>


        <button
          type="button"
          id="btnCancelarEdicao"
          class="btn-cancelar-edicao"
        >
          Cancelar edição
        </button>


        <button
          type="submit"
          id="btnSalvar"
          class="btn-salvar"
        >
          Salvar
        </button>


        <button
          type="button"
          id="voltar"
          class="btn-voltar"
        >
          Voltar
        </button>

      </div>

    </form>


    <!-- =====================================================
         MENSAGEM
    ====================================================== -->

    <p
      id="mensagem"
      class="mensagem"
    ></p>


    <!-- =====================================================
         TÍTULO DA TABELA
    ====================================================== -->

    <h2>
      Categorias Cadastradas
    </h2>


    <!-- =====================================================
         BARRA DE PESQUISA
         MESMO PADRÃO DA TELA DE ORÇAMENTOS
    ====================================================== -->

    <div class="barra-pesquisa">


      <!-- =================================================
           PESQUISA
      ================================================== -->

      <div class="campo-pesquisa">

        <label for="pesquisa">
          Pesquisar Categoria
        </label>


        <div class="input-pesquisa-wrapper">

          <input
            type="text"
            id="pesquisa"
            placeholder="Digite para pesquisar..."
            autocomplete="off"
          >


          <button
            type="button"
            id="btnLimparPesquisa"
            class="btn-limpar-pesquisa"
            title="Limpar pesquisa"
          >
            ×
          </button>

        </div>

      </div>


      <!-- =================================================
           FILTRO
      ================================================== -->

      <div class="campo-filtro">

        <label for="filtroPesquisa">
          Filtrar por
        </label>


        <select id="filtroPesquisa">

          <option value="">
            Todos os campos
          </option>


          <option value="categoriaprodutoid">
            Código
          </option>


          <option value="ds_categoria_produto">
            Descrição
          </option>

        </select>

      </div>

    </div>


    <!-- =====================================================
         MENSAGEM DA PESQUISA
    ====================================================== -->

    <div
      id="mensagemPesquisa"
      class="mensagem-pesquisa"
    ></div>


    <!-- =====================================================
         TABELA DE CATEGORIAS
    ====================================================== -->

    <table>

      <!-- ==================== CABEÇALHO ==================== -->

      <thead>

        <tr>

          <th>
            Código
          </th>

          <th>
            Descrição
          </th>

          <th>
            Ações
          </th>

        </tr>

      </thead>


      <!-- ==================== CORPO ==================== -->

      <tbody id="tabelaClientes">

        <tr>

          <td
            colspan="3"
            style="text-align: center;"
          >
            Carregando categorias...

          </td>

        </tr>

      </tbody>

    </table>


  </main>


  <!-- =====================================================
       SUPABASE
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- =====================================================
       JAVASCRIPT DA PÁGINA
  ====================================================== -->

  <script src="categoria.js"></script>


</body>

</html>
