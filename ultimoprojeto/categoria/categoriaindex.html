<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Categoria de Produto</title>
  <link rel="stylesheet" href="categoria.css">
</head>
<body>
  <main class="container">

    <h1>Cadastro de Categoria de Produto</h1>

    <form id="formCliente" class="form-cliente">

      <div class="campo">
        <label for="categoriaprodutoid">categoriaprodutoid</label>
        <input
          type="number"
          id="categoriaprodutoid"
          placeholder="Gerado automaticamente"
          readonly
        >
      </div>

      <div class="campo campo-largo">
        <label for="ds_categoria_produto">Descrição da Categoria</label>
        <input
          type="text"
          id="ds_categoria_produto"
          maxlength="100"
          placeholder="Digite a descrição da categoria"
          required
        >
      </div>

      <div class="acoes">
        <button type="reset" class="btn-limpar">
          Limpar
        </button>

        <button
          type="button"
          id="btnCancelarEdicao"
          class="btn-cancelar-edicao"
        >
          Cancelar edição
        </button>

        <button type="submit" id="btnSalvar" class="btn-salvar">
          Salvar
        </button>

        <button type="button" id="voltar" class="btn-voltar">Voltar</button>
      </div>
    </form>

    <p id="mensagem" class="mensagem"></p>

    <h2>Categorias Cadastradas</h2>

    <table>
      <thead>
        <tr>
          <th>categoriaprodutoid</th>
          <th>Descrição</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="tabelaClientes">
        <tr>
          <td colspan="3">Carregando categorias...</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="categoria.js"></script>
</body>
</html>
