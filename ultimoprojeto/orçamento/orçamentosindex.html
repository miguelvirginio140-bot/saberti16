<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Orçamentos</title>
  <link rel="stylesheet" href="teste2.css">

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="container">

    <!-- ==================== TELA 1: LISTAGEM DE ORÇAMENTOS ==================== -->
    <div id="telaTabela">

      <h2>Lista de Orçamentos</h2>

      <div style="margin-bottom: 15px; display: flex; gap: 10px;">
        <button type="button" id="btnNovoOrcamento" class="btn-salvar">
          Novo Orçamento
        </button>

        <button type="button" id="voltar" class="btn-voltar">
          Voltar ao Menu
        </button>
      </div>

      <div id="mensagemTabela" class="mensagem"></div>

      <table>
        <thead>
          <tr>
            <th>ID Orçamento</th>
            <th>Qtd Itens</th>
            <th>Cliente ID</th>
            <th>Data Orçamento</th>
            <th>Data Validade</th>
            <th>Valor Total</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="tabelaGeral">
          <!-- Preenchido via JavaScript -->
        </tbody>
      </table>

    </div>


    <!-- ==================== TELA 2: CADASTRO / EDIÇÃO ==================== -->
    <div id="telaCadastro" style="display: none;">

      <h2>Cadastro de Orçamento</h2>

      <div id="mensagemGeral" class="mensagem"></div>

      <form id="formOrcamentoGeral">

        <!-- ==================== DADOS DO ORÇAMENTO ==================== -->
        <div class="form-cliente">

          <div class="campo">
            <label for="orcamentoid">ID Orçamento</label>
            <input type="text" id="orcamentoid" readonly />
          </div>

          <div class="campo">
            <label for="clienteid">Cliente</label>
            <select id="clienteid" required>
              <option value="">Carregando clientes...</option>
            </select>
          </div>

          <div class="campo">
            <label for="dt_orcamento">Data do Orçamento</label>
            <input type="date" id="dt_orcamento" required />
          </div>

          <div class="campo">
            <label for="dt_validade_orcamento">
              Data de Validade
            </label>
            <input type="date" id="dt_validade_orcamento" required />
          </div>

          <div class="campo nome">
            <label for="vl_total_orcamento">
              Valor Total Geral (R$)
            </label>

            <input
              type="text"
              id="vl_total_orcamento"
              readonly
              value="0.00"
            />
          </div>

        </div>


        <hr>


        <!-- ==================== PRODUTOS / ITENS ==================== -->
        <h3>Adicionar Produtos / Itens</h3>

        <div class="form-cliente">

          <div class="campo">
            <label for="orcamentoitemid">ID do Item</label>
            <input type="text" id="orcamentoitemid" readonly />
          </div>

          <div class="campo">
            <label for="produtoid">Produto</label>

            <select id="produtoid">
              <option value="">
                Selecione um produto...
              </option>
            </select>
          </div>

          <div class="campo">
            <label for="qt_produto">Quantidade</label>

            <input
              type="number"
              id="qt_produto"
              step="any"
              min="0.01"
            />
          </div>

          <div class="campo">
            <label for="vl_unitario">
              Valor Unitário (R$)
            </label>

            <input
              type="text"
              id="vl_unitario"
            />
          </div>

          <div class="campo nome">
            <label for="vl_total">
              Valor Total do Item (R$)
            </label>

            <input
              type="text"
              id="vl_total"
              readonly
            />
          </div>

          <!--
            AGORA O BOTÃO SALVAR ORÇAMENTO FICA
            NA POSIÇÃO ONDE ESTAVA O ADICIONAR ITEM
          -->
          <div class="acoes botao-salvar-topo">

            <button
              type="submit"
              class="btn-salvar"
            >
              Salvar Orçamento Completo
            </button>

          </div>

        </div>


        <!-- ==================== TABELA DE ITENS ==================== -->
        <table class="tabela-carrinho">

          <thead>
            <tr>
              <th>ID Item</th>
              <th>ID Prod</th>
              <th>Produto</th>
              <th>Qtd</th>
              <th>Vlr. Unit</th>
              <th>Total</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="corpoTabelaCarrinho">

            <tr>
              <td colspan="7" style="text-align: center;">
                Nenhum produto adicionado ainda.
              </td>
            </tr>

          </tbody>

        </table>


        <!-- ==================== BOTÕES FINAIS ==================== -->
        <!--
          AGORA O ADICIONAR ITEM FICA NA PARTE INFERIOR,
          ONDE ESTAVA O SALVAR ORÇAMENTO
        -->
        <div class="acoes botoes-finais">

          <button
            type="button"
            id="btnLimparOrcamento"
            class="btn-limpar"
          >
            Limpar
          </button>

          <button
            type="button"
            id="btnVoltarTela1"
            class="btn-voltar"
          >
            Voltar
          </button>

          <button
            type="button"
            id="btnAddItem"
            class="btn-salvar"
          >
            Adicionar Item
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- Script JavaScript -->
  <script src="teste2.js"></script>

</body>
</html>
