<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gerenciamento de Orçamentos</title>

  <link
    rel="stylesheet"
    href="orçamentos.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>

  <div class="container">


    <!-- =====================================================
         TELA 1 - LISTA DE ORÇAMENTOS
         ===================================================== -->

    <div id="telaTabela">

      <h2>Lista de Orçamentos</h2>


      <!-- ==================== BOTÕES ==================== -->

      <div class="barra-botoes">

        <button
          type="button"
          id="btnNovoOrcamento"
          class="btn-salvar"
        >
          Novo Orçamento
        </button>


        <button
          type="button"
          id="voltar"
          class="btn-voltar"
        >
          Voltar ao Menu
        </button>

      </div>


      <!-- =================================================
           BARRA DE PESQUISA
           ================================================= -->

      <div class="barra-pesquisa">

        <!-- CAMPO DE PESQUISA -->

        <div class="campo-pesquisa">

          <label for="pesquisaOrcamento">
            Pesquisar Orçamento
          </label>


          <div class="input-pesquisa-wrapper">

            <input
              type="text"
              id="pesquisaOrcamento"
              placeholder="Digite para pesquisar..."
              autocomplete="off"
            >


            <button
              type="button"
              id="btnLimparPesquisa"
              class="btn-limpar-pesquisa"
              title="Limpar pesquisa"
            >
              ×
            </button>

          </div>

        </div>


        <!-- FILTRO -->

        <div class="campo-filtro">

          <label for="filtroPesquisa">
            Filtrar por
          </label>


          <select id="filtroPesquisa">

            <option value="">
              Todos os campos
            </option>


            <option value="orcamentoid">
              Código Orçamento
            </option>


            <option value="clienteid">
              Código Cliente
            </option>


            <option value="dt_orcamento">
              Data Orçamento
            </option>


            <option value="dt_validade_orcamento">
              Data Validade
            </option>


            <option value="vl_total_orcamento">
              Valor Total
            </option>

          </select>

        </div>

      </div>


      <!-- ==================== MENSAGEM ==================== -->

      <div
        id="mensagemTabela"
        class="mensagem"
      ></div>


      <!-- ==================== TABELA PRINCIPAL ==================== -->

      <div class="tabela-container">

        <table class="tabela-principal">

          <colgroup>

            <col class="col-id">

            <col class="col-qtd">

            <col class="col-cliente">

            <col class="col-data">

            <col class="col-data">

            <col class="col-valor">

            <col class="col-acoes">

          </colgroup>


          <thead>

            <tr>

              <th>
                Código Orçamento
              </th>

              <th>
                Qtd Itens
              </th>

              <th>
                Código Cliente
              </th>

              <th>
                Data Orçamento
              </th>

              <th>
                Data Validade
              </th>

              <th>
                Valor Total
              </th>

              <th>
                Ações
              </th>

            </tr>

          </thead>


          <tbody id="tabelaGeral">

          </tbody>

        </table>

      </div>

    </div>



    <!-- =====================================================
         TELA 2 - CADASTRO
         ===================================================== -->

    <div
      id="telaCadastro"
      style="display: none;"
    >

      <h2>Cadastro de Orçamento</h2>


      <div
        id="mensagemGeral"
        class="mensagem"
      ></div>


      <form id="formOrcamentoGeral">


        <!-- ==================== DADOS DO ORÇAMENTO ==================== -->

        <div class="form-cliente">


          <div class="campo">

            <label for="orcamentoid">
              Código Orçamento
            </label>

            <input
              type="text"
              id="orcamentoid"
              readonly
            >

          </div>


          <div class="campo">

            <label for="clienteid">
              Cliente
            </label>

            <select
              id="clienteid"
              required
            >

              <option value="">
                Carregando clientes...
              </option>

            </select>

          </div>


          <div class="campo">

            <label for="dt_orcamento">
              Data do Orçamento
            </label>

            <input
              type="date"
              id="dt_orcamento"
              required
            >

          </div>


          <div class="campo">

            <label for="dt_validade_orcamento">
              Data de Validade
            </label>

            <input
              type="date"
              id="dt_validade_orcamento"
              required
            >

          </div>


          <div class="campo nome">

            <label for="vl_total_orcamento">
              Valor Total Geral (R$)
            </label>

            <input
              type="text"
              id="vl_total_orcamento"
              readonly
              value="0.00"
            >

          </div>

        </div>


        <hr>


        <!-- ==================== PRODUTOS ==================== -->

        <h3>
          Adicionar Produtos / Itens
        </h3>


        <div class="form-cliente">


          <div class="campo">

            <label for="orcamentoitemid">
              Código do Item
            </label>

            <input
              type="text"
              id="orcamentoitemid"
              readonly
            >

          </div>


          <div class="campo">

            <label for="produtoid">
              Produto
            </label>

            <select id="produtoid">

              <option value="">
                Selecione um produto...
              </option>

            </select>

          </div>


          <div class="campo">

            <label for="qt_produto">
              Quantidade
            </label>

            <input
              type="number"
              id="qt_produto"
              step="any"
              min="0.01"
            >

          </div>


          <div class="campo">

            <label for="vl_unitario">
              Valor Unitário (R$)
            </label>

            <input
              type="text"
              id="vl_unitario"
            >

          </div>


          <div class="campo nome">

            <label for="vl_total">
              Valor Total do Item (R$)
            </label>

            <input
              type="text"
              id="vl_total"
              readonly
            >

          </div>


          <div class="acoes botao-salvar-topo">

            <button
              type="submit"
              class="btn-salvar"
            >
              Salvar Orçamento Completo
            </button>

          </div>

        </div>


        <!-- ==================== TABELA DE ITENS ==================== -->

        <div class="tabela-container">

          <table class="tabela-carrinho">

            <colgroup>

              <col class="item-id">

              <col class="item-produto-id">

              <col class="item-produto">

              <col class="item-qtd">

              <col class="item-unitario">

              <col class="item-total">

              <col class="item-acoes">

            </colgroup>


            <thead>

              <tr>

                <th>
                  Código Item
                </th>

                <th>
                  Código Prod
                </th>

                <th>
                  Produto
                </th>

                <th>
                  Qtd
                </th>

                <th>
                  Vlr. Unit
                </th>

                <th>
                  Total
                </th>

                <th>
                  Ações
                </th>

              </tr>

            </thead>


            <tbody id="corpoTabelaCarrinho">

              <tr>

                <td
                  colspan="7"
                  class="sem-itens"
                >
                  Nenhum produto adicionado ainda.
                </td>

              </tr>

            </tbody>

          </table>

        </div>


        <!-- ==================== BOTÕES FINAIS ==================== -->

        <div class="acoes botoes-finais">

          <button
            type="button"
            id="btnLimparOrcamento"
            class="btn-limpar"
          >
            Limpar
          </button>


          <button
            type="button"
            id="btnVoltarTela1"
            class="btn-voltar"
          >
            Voltar
          </button>


          <button
            type="button"
            id="btnAddItem"
            class="btn-salvar"
          >
            Adicionar Item
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="orçamentos.js"></script>

</body>

</html>
