<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cadastro de Produto</title>

  <link
    rel="stylesheet"
    href="produto.css"
  >

</head>


<body>

  <main class="container">


    <!-- =================================================
         TÍTULO
         ================================================= -->

    <h1>
      Cadastro de Produto
    </h1>


    <!-- =================================================
         FORMULÁRIO
         ================================================= -->

    <form
      id="formProduto"
      class="form-cliente"
    >


      <div class="campo">

        <label for="produtoid">
          Código
        </label>

        <input
          type="number"
          id="produtoid"
          placeholder="Gerado automático"
          readonly
        >

      </div>


      <div class="campo">

        <label for="categoriaprodutoid">
          Categoria
        </label>

        <select
          id="categoriaprodutoid"
          required
        >

          <option value="">
            Carregando...
          </option>

        </select>

      </div>


      <div class="campo campo-largo">

        <label for="ds_produto">
          Descrição do Produto
        </label>

        <input
          type="text"
          id="ds_produto"
          maxlength="100"
          placeholder="Digite a descrição"
          required
        >

      </div>


      <div class="campo">

        <label for="obs_produto">
          Observação
        </label>

        <input
          type="text"
          id="obs_produto"
          placeholder="Digite observações"
        >

      </div>


      <div class="campo">

        <label for="vl_venda_produto">
          Valor de Venda (R$)
        </label>

        <input
          type="number"
          step="0.01"
          id="vl_venda_produto"
          placeholder="0.00"
          required
        >

      </div>


      <div class="campo">

        <label for="dt_cadastro_produto">
          Data Cadastro
        </label>

        <input
          type="date"
          id="dt_cadastro_produto"
        >

      </div>


      <div class="campo">

        <label for="status_produto">
          Status
        </label>

        <select
          id="status_produto"
          required
        >

          <option value="">
            Selecione
          </option>

          <option value="ATIVO">
            Ativo
          </option>

          <option value="INATIVO">
            Inativo
          </option>

        </select>

      </div>


      <!-- =================================================
           AÇÕES
           ================================================= -->

      <div class="acoes">


        <button
          type="reset"
          class="btn-limpar"
        >
          Limpar
        </button>


        <button
          type="button"
          id="btnCancelarEdicao"
          class="btn-cancelar-edicao"
        >
          Cancelar edição
        </button>


        <button
          type="submit"
          id="btnSalvar"
          class="btn-salvar"
        >
          Salvar
        </button>


        <button
          type="button"
          id="voltar"
          class="btn-voltar"
        >
          Voltar
        </button>


      </div>

    </form>


    <!-- =================================================
         MENSAGEM
         ================================================= -->

    <p
      id="mensagem"
      class="mensagem"
    ></p>



    <!-- =================================================
         BARRA DE PESQUISA
         IGUAL À DE ORÇAMENTO
         ================================================= -->

    <div class="barra-pesquisa">


      <!-- CAMPO DE PESQUISA -->

      <div class="campo-pesquisa">

        <label for="pesquisaProduto">
          Pesquisar Produto
        </label>


        <div class="input-pesquisa-wrapper">

          <input
            type="text"
            id="pesquisaProduto"
            placeholder="Digite para pesquisar..."
            autocomplete="off"
          >


          <button
            type="button"
            id="btnLimparPesquisa"
            class="btn-limpar-pesquisa"
            title="Limpar pesquisa"
          >
            ×
          </button>

        </div>

      </div>



      <!-- FILTRO -->

      <div class="campo-filtro">

        <label for="filtroPesquisa">
          Filtrar por
        </label>


        <select id="filtroPesquisa">


          <option value="">
            Todos os campos
          </option>


          <option value="produtoid">
            Código
          </option>


          <option value="categoriaprodutoid">
            Código Categoria
          </option>


          <option value="ds_produto">
            Descrição
          </option>


          <option value="obs_produto">
            Observação
          </option>


          <option value="vl_venda_produto">
            Valor Venda
          </option>


          <option value="dt_cadastro_produto">
            Data Cadastro
          </option>


          <option value="status_produto">
            Status
          </option>


        </select>

      </div>


    </div>



    <!-- =================================================
         MENSAGEM DA PESQUISA
         ================================================= -->

    <div
      id="mensagemPesquisa"
      class="mensagem-pesquisa"
    ></div>



    <!-- =================================================
         TABELA DE PRODUTOS
         ================================================= -->

    <h2>
      Produtos Cadastrados
    </h2>


    <table>


      <thead>

        <tr>

          <th>
            Código
          </th>

          <th>
            Código.cat
          </th>

          <th>
            Descrição
          </th>

          <th>
            Observação
          </th>

          <th>
            Valor Venda
          </th>

          <th>
            Data Cad.
          </th>

          <th>
            Status
          </th>

          <th>
            Ações
          </th>

        </tr>

      </thead>


      <tbody id="tabelaProdutos">

        <tr>

          <td
            colspan="8"
            style="text-align: center;"
          >
            Carregando produtos...

          </td>

        </tr>

      </tbody>


    </table>


  </main>



  <!-- =================================================
       SUPABASE
       ================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- =================================================
       JAVASCRIPT DO PRODUTO
       ================================================= -->

  <script src="produto.js"></script>


</body>

</html>
