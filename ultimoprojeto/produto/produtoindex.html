<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produto</title>
  <link rel="stylesheet" href="produto.css">
</head>
<body>
  <main class="container">
 
    <h1>Cadastro de Produto</h1>

    <form id="formProduto" class="form-cliente">

      <div class="campo">
        <label for="produtoid">ID Produto</label>
        <input
          type="number"
          id="produtoid"
          placeholder="Gerado automático"
          readonly
        >
      </div>

      <div class="campo">
        <label for="categoriaprodutoid">Categoria</label>
        <select id="categoriaprodutoid" required>
          <option value="">Carregando...</option>
        </select>
      </div>

      <div class="campo campo-largo">
        <label for="ds_produto">Descrição do Produto</label>
        <input
          type="text"
          id="ds_produto"
          maxlength="100"
          placeholder="Digite a descrição"
          required
        >
      </div>

      <div class="campo">
        <label for="obs_produto">Observação</label>
        <input
          type="text"
          id="obs_produto"
          placeholder="Observações"
        >
      </div>

      <div class="campo">
        <label for="vl_venda_produto">Valor de Venda (R$)</label>
        <input
          type="number"
          step="0.01"
          id="vl_venda_produto"
          placeholder="0.00"
          required
        >
      </div>

      <div class="campo">
        <label for="dt_cadastro_produto">Data Cadastro</label>
        <input
          type="date"
          id="dt_cadastro_produto"
        >
      </div>

      <div class="campo">
        <label for="status_produto">Status</label>
        <select id="status_produto" required>
          <option value="">Selecione</option>
          <option value="ATIVO">Ativo</option>
          <option value="INATIVO">Inativo</option>
        </select>
      </div>

      <div class="acoes">
        <button type="reset" class="btn-limpar">
          Limpar
        </button>

        <button
          type="button"
          id="btnCancelarEdicao"
          class="btn-cancelar-edicao"
        >
          Cancelar edição
        </button>

        <button type="submit" id="btnSalvar" class="btn-salvar">
          Salvar
        </button>

        <button type="button" id="voltar" class="btn-voltar">Voltar</button>
      </div>
    </form>

    <p id="mensagem" class="mensagem"></p>

    <h2>Produtos Cadastrados</h2>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Cat. ID</th>
          <th>Descrição</th>
          <th>Observação</th>
          <th>Valor Venda</th>
          <th>Data Cad.</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="tabelaProdutos">
        <tr>
          <td colspan="8" style="text-align: center;">Carregando produtos...</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="produto.js"></script>
</body>
</html>
